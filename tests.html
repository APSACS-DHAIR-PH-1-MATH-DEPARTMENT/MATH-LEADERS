<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14532d">
  <title>Tests — Math Leaders</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="app-side" aria-label="Menu"></aside>
  <div class="shell__body">
    <header class="topbar" id="app-header"></header>
    <main class="wrap wrap--app">
      <div id="loading" class="skeleton" aria-label="Loading"></div>
      <div id="page-msg" role="alert" hidden></div>
      <button class="btn btn--ghost" id="retry" type="button" hidden>Try again</button>
      <div id="tests-wrap" hidden>
        <div class="card">
          <h1>Tests</h1>
          <p class="muted">Tests set by your teacher. Each test has a time limit, so read the rules before you start. Your result shows what you did well and what to practise next.</p>
        </div>
        <div class="card" id="none-card" hidden>
          <h2>No tests yet</h2>
          <p class="muted">When your teacher sets a test for your class, it will appear here.</p>
        </div>
        <div id="test-list" class="tests"></div>
      </div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/initiative.js"></script>
<script src="assets/js/datetime.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/tests.js"></script>
</body>
</html>
